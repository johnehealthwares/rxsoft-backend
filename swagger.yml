info:
  title: RxSoft Backend API
  description: Phase 3 identity module and API contracts
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    LoginDto:
      type: object
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: P@ssw0rd!
      required:
        - username
        - password
    AuthResponseDto:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresIn:
          type: number
        refreshTokenExpiresIn:
          type: number
      required:
        - accessToken
        - refreshToken
        - accessTokenExpiresIn
        - refreshTokenExpiresIn
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    CreateUserDto:
      type: object
      properties:
        username:
          type: string
          example: cashier01
        password:
          type: string
          example: P@ssw0rd!
        roleCodes:
          example:
            - cashier
          type: array
          items:
            type: string
      required:
        - username
        - password
    UserResponseDto:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        roles:
          type: array
          items:
            type: array
      required:
        - id
        - username
        - roles
    Object:
      type: object
      properties: {}
    AssignRoleDto:
      type: object
      properties:
        roleCode:
          type: string
          example: cashier
      required:
        - roleCode
    ProductCategoryResponse:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
      required:
        - id
        - code
        - name
    PharmaceuticsResponse:
      type: object
      properties:
        code:
          type: string
        clinicalName:
          type: string
        drugClass:
          type: string
        pharmaceutics:
          type: string
      required:
        - code
        - clinicalName
        - drugClass
        - pharmaceutics
    GenericProductResponse:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        pharmaceutics:
          $ref: '#/components/schemas/PharmaceuticsResponse'
        isPrescriptionRequired:
          type: boolean
        isControlledSubstance:
          type: boolean
      required:
        - id
        - code
        - name
        - pharmaceutics
        - isPrescriptionRequired
        - isControlledSubstance
    ProductResponseDto:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        categoryId:
          type: string
        genericProductId:
          type: string
        category:
          $ref: '#/components/schemas/ProductCategoryResponse'
        genericProduct:
          $ref: '#/components/schemas/GenericProductResponse'
        barcode:
          type: object
          nullable: true
        baseUomId:
          type: string
        purchaseUomId:
          type: object
          nullable: true
        saleUomId:
          type: object
          nullable: true
        saleUom:
          type: object
          nullable: true
        baseUom:
          type: object
          nullable: true
        purchaseUom:
          type: object
          nullable: true
        trackLot:
          type: boolean
        trackExpiry:
          type: boolean
        shelfLifeDays:
          type: object
          nullable: true
        isActive:
          type: boolean
      required:
        - id
        - code
        - name
        - categoryId
        - genericProductId
        - category
        - genericProduct
        - barcode
        - baseUomId
        - purchaseUomId
        - saleUomId
        - saleUom
        - baseUom
        - purchaseUom
        - trackLot
        - trackExpiry
        - shelfLifeDays
        - isActive
    CreateProductDto:
      type: object
      properties:
        code:
          type: string
          example: PCM001
        name:
          type: string
          example: Paracetamol 500mg Tablet
        categoryId:
          type: string
          example: 2f9e3c8a-7fb2-4f43-98b7-5f2a0d4f9021
        genericProductId:
          type: string
          example: 5c0d6f5d-2952-4924-8ec6-c2c488a54cab
        baseUomId:
          type: string
          example: 8f6c4d74-607a-4d90-96f5-4aa6f4a32b31
        purchaseUomId:
          type: string
          example: 8f6c4d74-607a-4d90-96f5-4aa6f4a32b31
        saleUomId:
          type: string
          example: 8f6c4d74-607a-4d90-96f5-4aa6f4a32b31
        barcode:
          type: string
          example: '1234567890123'
        trackLot:
          type: boolean
          default: true
        trackExpiry:
          type: boolean
          default: true
        shelfLifeDays:
          type: number
          example: 730
        isActive:
          type: boolean
          default: true
      required:
        - code
        - name
        - categoryId
        - genericProductId
        - baseUomId
    CreateGenericProductDto:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        pharmaceuticsId:
          type: string
        therapeuticClass:
          type: string
        dosageForm:
          type: string
        strength:
          type: string
        generalUse:
          type: string
        adultDosage:
          type: string
        pediatricDosage:
          type: string
        isPrescriptionRequired:
          type: boolean
          default: false
        isControlledSubstance:
          type: boolean
          default: false
      required:
        - code
        - name
        - pharmaceuticsId
    UpdateGenericProductDto:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        pharmaceuticsId:
          type: string
        therapeuticClass:
          type: string
        dosageForm:
          type: string
        strength:
          type: string
        generalUse:
          type: string
        adultDosage:
          type: string
        pediatricDosage:
          type: string
        isPrescriptionRequired:
          type: boolean
        isControlledSubstance:
          type: boolean
    CreatePharmaceuticsDto:
      type: object
      properties:
        code:
          type: string
        commonBrandName:
          type: string
        commonGenericName:
          type: string
        clinicalName:
          type: string
        drugClass:
          type: string
        chemicalConstituents:
          type: string
        pharmaceutics:
          type: string
        indications:
          type: string
        contraindications:
          type: string
        mechanism:
          type: string
        missedDose:
          type: string
        drugInteractions:
          type: string
        dosage:
          type: string
        drugComponentIds:
          type: array
          items:
            type: string
      required:
        - code
    UpdatePharmaceuticsDto:
      type: object
      properties:
        code:
          type: string
        commonBrandName:
          type: string
        commonGenericName:
          type: string
        clinicalName:
          type: string
        drugClass:
          type: string
        chemicalConstituents:
          type: string
        pharmaceutics:
          type: string
        indications:
          type: string
        contraindications:
          type: string
        mechanism:
          type: string
        missedDose:
          type: string
        drugInteractions:
          type: string
        dosage:
          type: string
        drugComponentIds:
          type: array
          items:
            type: string
      required:
        - code
    CreateDrugComponentDto:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    UpdateDrugComponentDto:
      type: object
      properties:
