info:
  title: RxSoft Backend API
  description: Phase 3 identity module and API contracts
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    Object:
      type: object
      properties: {}
    ItemCategoryResponse:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
      required:
        - id
        - code
        - name
    PharmaceuticsResponse:
      type: object
      properties:
        code:
          type: string
        clinicalName:
          type: string
        drugClass:
          type: string
        pharmaceutics:
          type: string
      required:
        - code
        - clinicalName
        - drugClass
        - pharmaceutics
    GenericProductResponse:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        pharmaceutics:
          $ref: '#/components/schemas/PharmaceuticsResponse'
        isPrescriptionRequired:
          type: boolean
        isControlledSubstance:
          type: boolean
      required:
        - id
        - code
        - name
        - pharmaceutics
        - isPrescriptionRequired
        - isControlledSubstance
    ItemResponseDto:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        categoryId:
          type: string
        genericProductCode:
          type: object
        category:
          $ref: '#/components/schemas/ItemCategoryResponse'
        genericProduct:
